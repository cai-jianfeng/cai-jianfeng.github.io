name: Build and deploy Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Scholar API secret
        if: github.event_name != 'push'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::error::SERPAPI_KEY is not configured in repository secrets."
            exit 1
          fi

      - name: Refresh Google Scholar citations
        env:
          SCHOLAR_PROFILE_ID: 1gqJAgcAAAAJ
          SCHOLAR_STRICT: ${{ github.event_name != 'push' }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py

      - name: Commit refreshed citation count
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- _data/scholar.json; then
            echo "Google Scholar citation count is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.json
          git commit -m "update scholar citations"
          git push origin HEAD:master

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
